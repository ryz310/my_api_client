name: Dependabot Auto Merge

on:
  pull_request_target:
    types:
      - opened
      - reopened
      - synchronize

permissions: {}

jobs:
  enable-automerge-bundler:
    if: ${{ github.actor == 'dependabot[bot]' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate bundler update safety
        id: guard
        if: ${{ steps.metadata.outputs.package-ecosystem == 'bundler' }}
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          UPDATE_TYPE: ${{ steps.metadata.outputs.update-type }}
          DEPENDENCY_TYPE: ${{ steps.metadata.outputs.dependency-type }}
          DEPENDENCY_NAME: ${{ steps.metadata.outputs.dependency-name }}
          DEPENDENCY_NAMES: ${{ steps.metadata.outputs.dependency-names }}
        run: |
          set -euo pipefail

          safe=false

          deps="$DEPENDENCY_NAMES"
          if [[ -z "$deps" ]]; then
            deps="$DEPENDENCY_NAME"
          fi

          rails_involved=false
          while IFS= read -r dep; do
            dep="$(echo "$dep" | xargs)"
            [[ -z "$dep" ]] && continue
            if [[ "$dep" == "rails" ]]; then
              rails_involved=true
            fi
          done < <(echo "$deps" | tr ',' '\n')

          if [[ "$HEAD_REF" == *"/rails_app/"* ]]; then
            # Verification Rails apps: always auto-merge, except a major bump of the rails gem itself.
            if [[ "$UPDATE_TYPE" == "version-update:semver-major" && "$rails_involved" == "true" ]]; then
              echo "Skip auto-merge: major update of the rails gem in a rails_app verification app."
              safe=false
            else
              safe=true
            fi
          elif [[ "$HEAD_REF" == *"/my_api/"* ]]; then
            # Verification API app: always auto-merge regardless of update type.
            safe=true
          elif [[ ("$UPDATE_TYPE" == "version-update:semver-patch" || "$UPDATE_TYPE" == "version-update:semver-minor") && "$DEPENDENCY_TYPE" == "direct:development" ]]; then
            # The gem itself (root Gemfile): only direct development patch/minor updates.
            safe=true
          else
            echo "Skip auto-merge: gem update does not match auto-merge policy ($UPDATE_TYPE, $DEPENDENCY_TYPE)."
          fi

          echo "safe=$safe" >> "$GITHUB_OUTPUT"

      - name: Enable auto-merge for safe bundler updates
        if: ${{ steps.metadata.outputs.package-ecosystem == 'bundler' && steps.guard.outputs.safe == 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: gh pr merge --repo "$GITHUB_REPOSITORY" --auto --merge "$PR_NUMBER"

  enable-automerge-github-actions:
    if: ${{ github.actor == 'dependabot[bot]' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate GitHub Actions update safety
        id: guard
        if: ${{ steps.metadata.outputs.package-ecosystem == 'github-actions' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          UPDATE_TYPE: ${{ steps.metadata.outputs.update-type }}
          DEPENDENCY_NAME: ${{ steps.metadata.outputs.dependency-name }}
          DEPENDENCY_NAMES: ${{ steps.metadata.outputs.dependency-names }}
        run: |
          set -euo pipefail

          safe=true

          if [[ "$UPDATE_TYPE" != "version-update:semver-patch" && "$UPDATE_TYPE" != "version-update:semver-minor" ]]; then
            echo "Skip auto-merge: update type is not patch/minor ($UPDATE_TYPE)."
            safe=false
          fi

          deps="$DEPENDENCY_NAMES"
          if [[ -z "$deps" ]]; then
            deps="$DEPENDENCY_NAME"
          fi

          if [[ -z "$deps" ]]; then
            echo "Skip auto-merge: dependency name is missing."
            safe=false
          else
            while IFS= read -r dep; do
              dep="$(echo "$dep" | xargs)"
              [[ -z "$dep" ]] && continue

              if [[ ! "$dep" =~ ^actions/ && ! "$dep" =~ ^github/ ]]; then
                echo "Skip auto-merge: non-GitHub official action detected ($dep)."
                safe=false
              fi
            done < <(echo "$deps" | tr ',' '\n')
          fi

          files_json="$(gh api -H "Accept: application/vnd.github+json" "/repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files?per_page=100")"
          if echo "$files_json" | jq -r '.[] | select((.patch // "") | test("(?m)^[+-]\\s*(permissions|pull_request_target)\\s*:")) | .filename' | grep -q .; then
            echo "Skip auto-merge: permissions or pull_request_target changes were detected."
            safe=false
          fi

          echo "safe=$safe" >> "$GITHUB_OUTPUT"

      - name: Enable auto-merge for safe GitHub Actions patch/minor updates
        if: ${{ steps.metadata.outputs.package-ecosystem == 'github-actions' && steps.guard.outputs.safe == 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: gh pr merge --repo "$GITHUB_REPOSITORY" --auto --merge "$PR_NUMBER"
