name: Release

on:
  push:
    branches:
      - release
  workflow_dispatch:

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # rubygems/release-gem runs `rake release`, which pushes the git tag,
      # so the checkout credentials must persist for this release job.
      - uses: actions/checkout@v7 # zizmor: ignore[artipacked]
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}

      - name: Set up Ruby
        # bundler-cache is disabled to avoid a cache-poisoning attack surface:
        # this workflow publishes a gem, so a poisoned dependency cache could
        # contaminate the released artifact.
        uses: ruby/setup-ruby@a0102e0972be65f351c307e2d64b9314a57c8073 # v1.324.0
        with:
          ruby-version: '4.0'
          bundler-cache: false

      - name: Install dependencies
        run: bundle install

      - name: Release gem via Trusted Publishing
        uses: rubygems/release-gem@7f9650160c1a4e7989fdc9855807bdbd421d8b6b # v1.4.1
