name: Release

on:
  push:
    branches:
      - release
  workflow_dispatch:

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # rubygems/release-gem runs `rake release`, which pushes the git tag,
      # so the checkout credentials must persist for this release job.
      - uses: actions/checkout@v7 # zizmor: ignore[artipacked]
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}

      - name: Set up Ruby
        # bundler-cache is disabled to avoid a cache-poisoning attack surface:
        # this workflow publishes a gem, so a poisoned dependency cache could
        # contaminate the released artifact.
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: '4.0'
          bundler-cache: false

      - name: Install dependencies
        run: bundle install

      - name: Release gem via Trusted Publishing
        uses: rubygems/release-gem@052cc82692552de3ef2b81fd670e41d13cba8092 # v1.4.0
