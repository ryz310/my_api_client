version: 2
# cooldown: defer version bumps until a release has aged, reducing the risk of
# adopting a compromised or broken version right after publication. Longer for
# higher-impact bumps (major > minor > patch).
updates:
- package-ecosystem: bundler
  directory: "/"
  schedule:
    interval: weekly
    time: "08:00"
    timezone: Asia/Tokyo
  cooldown:
    default-days: 7
    semver-major-days: 14
    semver-minor-days: 7
    semver-patch-days: 3
  open-pull-requests-limit: 10
  assignees:
  - ryz310
  labels:
  - dependabot
  ignore:
  - dependency-name: rubocop
    versions:
    - 1.9.0
- package-ecosystem: github-actions
  directory: "/"
  schedule:
    interval: weekly
    time: "08:00"
    timezone: Asia/Tokyo
  cooldown:
    default-days: 7
    semver-major-days: 14
    semver-minor-days: 7
    semver-patch-days: 3
  open-pull-requests-limit: 10
  assignees:
  - ryz310
  labels:
  - dependabot
